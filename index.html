<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="点菜">
<meta name="theme-color" content="#FFFBF3">
<title>点菜</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #FFFBF3;
    color: #2F2A25;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }

  /* ===== 顶部 ===== */
  .top {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255, 251, 243, .94);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid #F0E4D0;
    padding: calc(8px + env(safe-area-inset-top)) 12px 0;
  }
  .titlebar { display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; }
  .titlebar h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: 2px; }
  .titlebar .logo { font-size: 20px; }
  .searchbox input {
    width: 100%; border: none; outline: none; border-radius: 10px;
    background: #F4EBDD; padding: 9px 14px; font-size: 15px; color: #2F2A25;
    -webkit-appearance: none; appearance: none; font-family: inherit;
  }
  .searchbox input::placeholder { color: #A9977C; }
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 0;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 0 0 auto; border: 1px solid #E8D9BF; background: #fff; color: #7A6A52;
    font-size: 13px; padding: 6px 13px; border-radius: 16px; font-family: inherit;
  }
  .tabs button:active { background: #F6EEDF; }

  /* ===== 列表 ===== */
  main { padding: 12px 12px 0; }
  .card {
    background: #fff; border-radius: 16px; padding: 14px 14px 2px; margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(160, 138, 106, .08);
  }
  .card h2 {
    font-size: 17px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .card h2::before {
    content: ""; width: 4px; height: 16px; border-radius: 2px; background: #B03A2E;
  }
  .group { margin-bottom: 14px; }
  .group h3 {
    font-size: 13px; margin: 0 0 9px; font-weight: 600;
    display: inline-block; padding: 3px 11px; border-radius: 11px;
  }
  .group.cold h3 { color: #2E7D6B; background: #E4F2EE; }
  .group.hot h3 { color: #C0392B; background: #FBE9E2; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid #E8DCC8; background: #FFFDF9; color: #3A322A;
    font-size: 14px; padding: 8px 13px; border-radius: 11px;
    font-family: inherit; transition: transform .12s, background .15s;
  }
  .chip:active { transform: scale(.95); }
  .chip.on {
    background: #B03A2E; border-color: #B03A2E; color: #fff;
    box-shadow: 0 2px 8px rgba(176, 58, 46, .3);
  }
  .chip.on::after { content: "✓"; margin-left: 6px; font-size: 12px; opacity: .9; }

  /* ===== 底部操作栏 ===== */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255, 251, 243, .96);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid #F0E4D0;
  }
  .bar .info { font-size: 13px; color: #7A6A52; flex: 0 0 auto; line-height: 1.2; }
  .bar .info b { color: #B03A2E; font-size: 19px; display: block; }
  .bar button {
    border: none; border-radius: 12px; font-family: inherit;
    font-size: 15px; font-weight: 600; padding: 12px 16px;
  }
  #clear { background: #F1E7D6; color: #7A6A52; }
  #make {
    flex: 1; background: linear-gradient(135deg, #C0392B, #8E2B21); color: #fff;
    box-shadow: 0 4px 14px rgba(176, 58, 46, .35);
  }
  #make:active, #clear:active { transform: scale(.98); }

  /* ===== 弹层 ===== */
  .modal {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(30, 22, 14, .78);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    padding: calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
    flex-direction: column;
  }
  .modal.show { display: flex; }
  .modal-head {
    color: #F5EBD8; font-size: 14px; text-align: center; margin-bottom: 10px;
    letter-spacing: .5px;
  }
  .modal-body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    border-radius: 14px; text-align: center; min-height: 0;
  }
  .modal-body img { width: 100%; border-radius: 14px; display: block; }
  .modal-foot { display: flex; gap: 10px; margin-top: 12px; }
  .modal-foot button, .modal-foot a {
    flex: 1; text-align: center; border: none; border-radius: 12px;
    padding: 13px; font-size: 15px; font-weight: 600;
    font-family: inherit; text-decoration: none; display: block;
  }
  #close { background: #F1E7D6; color: #5A4A38; }
  #dl { background: #fff; color: #B03A2E; }

  /* ===== Toast ===== */
  #toast {
    position: fixed; left: 50%; bottom: 130px;
    transform: translateX(-50%) translateY(10px);
    background: rgba(43, 33, 24, .92); color: #fff;
    padding: 10px 20px; border-radius: 20px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: .25s; z-index: 200;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

/* ======================= 基础工具 ======================= */
const FONT = '"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif';
const kk = (c, t, n) => c + '|' + t + '|' + n;

const listEl  = document.getElementById('list');
const tabsEl  = document.getElementById('tabs');
const cntEl   = document.getElementById('cnt');
const modal   = document.getElementById('modal');
const imgEl   = document.getElementById('outImg');
const dlEl    = document.getElementById('dl');

const sel = new Map(); // key -> {cuisine, type, name}

/* Toast */
let toastTimer;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* 圆角矩形 */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ======================= 渲染列表 ======================= */
function renderList() {
  let html = '';
  CUISINES.forEach((c, i) => {
    const chipsCold = c.cold.map(n => {
      const k = kk(c.name, 'cold', n);
      return `<button class="chip${sel.has(k) ? ' on' : ''}" data-key="${k}" data-name="${n}">${n}</button>`;
    }).join('');
    const chipsHot = c.hot.map(n => {
      const k = kk(c.name, 'hot', n);
      return `<button class="chip${sel.has(k) ? ' on' : ''}" data-key="${k}" data-name="${n}">${n}</button>`;
    }).join('');

    html += `
      <section class="card" id="sec-${i}" data-cuisine="${c.name}">
        <h2>${c.name}</h2>
        <div class="group cold"><h3>冷菜</h3><div class="chips">${chipsCold}</div></div>
        <div class="group hot"><h3>热菜</h3><div class="chips">${chipsHot}</div></div>
      </section>`;
  });
  listEl.innerHTML = html;
}

function renderTabs() {
  tabsEl.innerHTML = CUISINES
    .map((c, i) => `<button data-idx="${i}">${c.name}</button>`)
    .join('');
}

function updateCount() {
  cntEl.textContent = sel.size;
}

/* ======================= 交互 ======================= */
listEl.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const k = chip.dataset.key;
  if (sel.has(k)) {
    sel.delete(k);
    chip.classList.remove('on');
  } else {
    const parts = k.split('|');
    sel.set(k, { cuisine: parts[0], type: parts[1], name: parts[2] });
    chip.classList.add('on');
  }
  updateCount();
});

tabsEl.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const sec = document.getElementById('sec-' + b.dataset.idx);
  if (!sec) return;
  const topEl = document.querySelector('.top');
  const offset = topEl ? topEl.offsetHeight : 130;
  const y = sec.getBoundingClientRect().top + window.pageYOffset - offset - 8;
  window.scrollTo({ top: Math.max(y, 0), behavior: 'smooth' });
});

    card.querySelectorAll('.group').forEach(g => {
      let v = 0;
      g.querySelectorAll('.chip').forEach(ch => {
        const name = ch.dataset.name;
        const match = !q || name.includes(q) || cuisineName.includes(q);
        ch.style.display = match ? '' : 'none';
        if (match) v++;
      });
      g.style.display = v ? '' : 'none';
      visible += v;
    });
    card.style.display = visible ? '' : 'none';
  });
});

/* 清空 */
document.getElementById('clear').addEventListener('click', () => {
  if (!sel.size) return;
  sel.clear();
  document.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
  updateCount();
  toast('已清空');
});

/* ======================= 生成菜单图片 ======================= */
function generateImage() {
  /* 1. 按菜系分组收集已选 */
  const groups = [];
  CUISINES.forEach(c => {
    const cold = c.cold.filter(n => sel.has(kk(c.name, 'cold', n)));
    const hot  = c.hot.filter(n => sel.has(kk(c.name, 'hot', n)));
    if (cold.length || hot.length) groups.push({ name: c.name, cold, hot });
  });

  if (!groups.length) {
    toast('还没有选菜，先点几道吧～');
    return;
  }

  const W = 750;
  const PAD = 62;
  const blocks = [];
  const add = (h, draw) => blocks.push({ h, draw: draw || (() => {}) });

  /* 菜品行绘制器 */
  const dishDrawer = (name) => (ctx, y) => {
    ctx.beginPath();
    ctx.arc(PAD + 9, y + 26, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = '#C9A961';
    ctx.fill();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#33291F';
    ctx.font = `28px ${FONT}`;
    ctx.fillText(name, PAD + 28, y + 36);
  };

  /* 分组小标签绘制器 */
  const tagDrawer = (label, color, bg) => (ctx, y) => {
    ctx.font = `600 23px ${FONT}`;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = bg;
    roundRect(ctx, PAD, y + 8, tw + 34, 36, 18);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.fillText(label, PAD + 17, y + 33);
  };

  /* ---------- 顶部 ---------- */
  add(46);
  add(88, (ctx, y) => {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#2B2118';
    ctx.font = `700 52px ${FONT}`;
    ctx.fillText('今 日 菜 单', W / 2, y + 62);
  });

  const d = new Date();
  const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 星期${'日一二三四五六'[d.getDay()]}`;
  add(52, (ctx, y) => {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#A08A6A';
    ctx.font = `25px ${FONT}`;
    ctx.fillText(dateStr, W / 2, y + 32);
  });

  /* 装饰分隔线 */
  add(58, (ctx, y) => {
    const cy = y + 26;
    ctx.strokeStyle = '#E2D3B6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(PAD, cy);
    ctx.lineTo(W / 2 - 30, cy);
    ctx.moveTo(W / 2 + 30, cy);
    ctx.lineTo(W - PAD, cy);
    ctx.stroke();

    ctx.fillStyle = '#C9A961';
    ctx.save();
    ctx.translate(W / 2, cy);
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(-7, -7, 14, 14);
    ctx.restore();
  });

  /* ---------- 菜系内容 ---------- */
  groups.forEach(g => {
    add(78, (ctx, y) => {
      ctx.fillStyle = '#B03A2E';
      roundRect(ctx, PAD, y + 22, 7, 34, 3.5);
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#2B2118';
      ctx.font = `700 38px ${FONT}`;
      ctx.fillText(g.name, PAD + 26, y + 52);
    });

    if (g.cold.length) {
      add(52, tagDrawer('冷菜', '#2E7D6B', '#E4F2EE'));
      g.cold.forEach(n => add(52, dishDrawer(n)));
    }
    if (g.hot.length) {
      add(52, tagDrawer('热菜', '#C0392B', '#FBE9E2'));
      g.hot.forEach(n => add(52, dishDrawer(n)));
    }

    add(22);
  });

  /* ---------- 底部 ---------- */
  add(26);
  add(46, (ctx, y) => {
    const cy = y + 20;
    ctx.strokeStyle = '#E2D3B6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(PAD, cy);
    ctx.lineTo(W - PAD, cy);
    ctx.stroke();
  });

  const total = groups.reduce((s, g) => s + g.cold.length + g.hot.length, 0);
  const coldN = groups.reduce((s, g) => s + g.cold.length, 0);
  add(72, (ctx, y) => {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8A7554';
    ctx.font = `600 26px ${FONT}`;
    ctx.fillText(`共 ${total} 道菜 · 冷菜 ${coldN} · 热菜 ${total - coldN}`, W / 2, y + 40);
  });
  add(56);

  /* ---------- 计算尺寸 ---------- */
  let H = 0;
  blocks.forEach(b => { H += b.h; });

  let scale = 2;
  if (H * scale > 12000) scale = 1.5;
  if (H * scale > 16000) scale = 1;

  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(W * scale);
  canvas.height = Math.round(H * scale);
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.textBaseline = 'alphabetic';

  /* 背景 */
  ctx.fillStyle = '#FFFCF5';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#E6D8BC';
  ctx.lineWidth = 2;
  ctx.strokeRect(28, 28, W - 56, H - 56);

  /* 逐块绘制 */
  let y = 0;
  blocks.forEach(b => {
    b.draw(ctx, y);
    y += b.h;
  });

  /* ---------- 输出 ---------- */
  const url = canvas.toDataURL('image/png');
  imgEl.src = url;
  dlEl.href = url;
  modal.classList.add('show');
  modal.querySelector('.modal-body').scrollTop = 0;
}

/* 按钮事件 */
document.getElementById('make').addEventListener('click', generateImage);
document.getElementById('close').addEventListener('click', () => modal.classList.remove('show'));

/* ======================= 启动 ======================= */
renderTabs();
renderList();
updateCount();
</script>
